// Most recent date with data anywhere across all agencies/streams — a block only
// shows "current streak" if its own data reaches this date (otherwise the streak
// is stale and misleading)
const GLOBAL_LAST_DATE = AGENCIES.reduce((m,ag)=>ag.last_date>m?ag.last_date:m,'');

const CAL_COLORS=['#21262d','#0e4429','#006d32','#26a641','#39d353'];
const MAIN_STREAMS=new Set([
  'vehicles','alerts','predictions','stop_events',
  'schedules','services','shapes','trips','lines',
  'routes','route_patterns','facilities','stops','live_facilities',
  'VehiclePositions','Alerts','TripUpdates',
]);
function streamGroup(s){
  if(s.toLowerCase().includes('enhanced'))return'enhanced';
  if(MAIN_STREAMS.has(s))return'main';
  return'custom';
}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW_LABELS=['Su','M','T','W','Th','F','Sa'];
const TIPS=['No data','<500 rows','500–2k rows','2k–10k rows','≥10k rows'];

const tt=document.getElementById('tt');
function showTip(e,html){tt.innerHTML=html;tt.classList.add('show');moveTip(e);}
function moveTip(e){
  tt.style.left=Math.min(e.clientX+14,window.innerWidth-210)+'px';
  tt.style.top=Math.max(e.clientY-30,4)+'px';
}
function hideTip(){tt.classList.remove('show');}

function isoDate(dt){
  return [dt.getFullYear(),String(dt.getMonth()+1).padStart(2,'0'),
    String(dt.getDate()).padStart(2,'0')].join('-');
}
function addDays(dt,n){const d=new Date(dt);d.setDate(d.getDate()+n);return d;}
function sundayOf(dt){const d=new Date(dt);d.setDate(d.getDate()-d.getDay());return d;}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function level(rc){
  if(rc===undefined||rc===null||rc===0)return 0;
  if(rc<500)return 1;if(rc<2000)return 2;if(rc<10000)return 3;return 4;
}

let activeYear='';
let activeStream='All';
let activeAgency='All';

function getAgencyDays(ag, streamName, year){
  const yr=year||activeYear;
  const days={};
  const streamValues = streamName
    ? [((ag.streams || {})[streamName]) || {}]
    : (activeStream === 'All'
        ? Object.values(ag.streams || {})
        : [((ag.streams || {})[activeStream]) || {}]);
  streamValues.forEach(sd=>{
    Object.entries(sd).forEach(([ds,rc])=>{
      if(yr==='All'||ds.startsWith(yr))days[ds]=(days[ds]||0)+rc;
    });
  });
  return days;
}

function getConsecutiveStats(dates){
  if(!dates || !dates.length)return {longest:0,current:0};
  const sorted=[...new Set(dates)].sort();
  let longest=1;
  let current=1;
  let prev=null;
  sorted.forEach(ds=>{
    const dt=new Date(ds+'T00:00:00');
    if(prev && (dt - prev) === 86400000){
      current += 1;
      longest = Math.max(longest,current);
    }else{
      current = 1;
    }
    prev=dt;
  });
  return {longest,current};
}

function getAgencyAllDates(ag, streamName){
  // Every date with data for this stream (or the currently filtered streams),
  // ignoring the year filter — used for the all-time total and so streaks can
  // span year boundaries. Mirrors getAgencyDays' stream selection so the
  // summary always matches what the calendar is showing.
  const dates=new Set();
  const streamValues = streamName
    ? [((ag.streams || {})[streamName]) || {}]
    : (activeStream === 'All'
        ? Object.values(ag.streams || {})
        : [((ag.streams || {})[activeStream]) || {}]);
  streamValues.forEach(sd=>Object.keys(sd).forEach(ds=>dates.add(ds)));
  return [...dates].sort();
}

function getSummaryText(yearCount, totalCount, stats, lastDate){
  const plural=n=>n===1?'day':'days';
  const scope = activeYear==='All'
    ? `${totalCount} ${plural(totalCount)} total`
    : `${yearCount} ${plural(yearCount)} in ${activeYear}; ${totalCount} ${plural(totalCount)} total`;
  let out=`${scope}; longest streak ${stats.longest} ${plural(stats.longest)}`;
  if(lastDate===GLOBAL_LAST_DATE)
    out+=`; current streak ${stats.current} ${plural(stats.current)}`;
  return out;
}

function agencyNameLink(ag){
  return ag.url
    ? '<a class="agency-name" href="' + ag.url + '" target="_blank" rel="noopener">' + ag.name + '</a>'
    : '<span class="agency-name">' + ag.name + '</span>';
}

function buildYearCal(days, yearStr){
  // Builds one calendar year (month labels row + heatmap grid) for the given
  // {date: rowCount} map. Returns [monthRow, grid] for the caller to append.
  const yearStart=new Date(parseInt(yearStr),0,1);
  const yearEnd=new Date(parseInt(yearStr),11,31);
  const calStart =sundayOf(yearStart);
  const calEndDay=yearEnd.getDay();
  const calEnd=addDays(yearEnd,calEndDay===6?0:6-calEndDay);

  const weeks=[];let week=[],cur=new Date(calStart);
  while(cur<=calEnd){
    week.push(new Date(cur));
    if(cur.getDay()===6){weeks.push(week);week=[];}
    cur=addDays(cur,1);
  }
  if(week.length)weeks.push(week);

  // Month row
  const monthRow=document.createElement('div');
  monthRow.className='month-row';
  weeks.forEach(wk=>{
    const span=document.createElement('span');
    span.className='month-lbl';
    const firstOfMonth=wk.find(x=>x.getDate()===1&&x>=yearStart&&x<=yearEnd);
    if(firstOfMonth)span.textContent=MONTHS[firstOfMonth.getMonth()];
    else if(wk===weeks[0]){const iy=wk.find(x=>x>=yearStart);if(iy)span.textContent=MONTHS[iy.getMonth()];}
    monthRow.appendChild(span);
  });

  const grid=document.createElement('div');grid.className='cal-grid';

  const dowCol=document.createElement('div');dowCol.className='dow-col';
  DOW_LABELS.forEach(l=>{
    const s=document.createElement('div');s.className='dow-lbl';s.textContent=l;
    dowCol.appendChild(s);
  });
  grid.appendChild(dowCol);

  const weeksDiv=document.createElement('div');weeksDiv.className='cal-weeks';
  weeks.forEach(wk=>{
    const col=document.createElement('div');col.className='week-col';
    wk.forEach(day=>{
      const ds=isoDate(day);
      const cell=document.createElement('div');cell.className='dc';
      const inYear=day>=yearStart&&day<=yearEnd;
      if(!inYear){cell.classList.add('dc-blank');}
      else{
        const rc=days[ds],lv=level(rc);
        cell.classList.add('dc'+lv);
        const dateFmt=day.toLocaleDateString('en-US',{month:'long'})+' '+ordinal(day.getDate())+', '+day.getFullYear();
        const rowStr=rc!==undefined?`${Number(rc).toLocaleString()} rows`:'No data';
        cell.addEventListener('mouseenter',e=>showTip(e,`<strong>${dateFmt}</strong><br>${rowStr}`));
        cell.addEventListener('mousemove',moveTip);
        cell.addEventListener('mouseleave',hideTip);
      }
      col.appendChild(cell);
    });
    weeksDiv.appendChild(col);
  });
  grid.appendChild(weeksDiv);

  return [monthRow, grid];
}

function buildAgency(ag, streamName){
  const days=getAgencyDays(ag, streamName);
  const dayCount=Object.keys(days).length;
  const allDates=getAgencyAllDates(ag, streamName);
  const stats=getConsecutiveStats(allDates);
  const summaryText=getSummaryText(dayCount, allDates.length, stats, allDates[allDates.length-1]);

  if(!ag.is_rt||dayCount===0)return null;

  const block=document.createElement('div');
  block.className='agency-block';

  const hdr=document.createElement('div');
  hdr.className='agency-header';
  // All views: name row on top, (summary) on its own line beneath it.
  // All-agencies view row:  MBTA — Massachusetts Bay Transportation Authority (hyperlinked)
  //   — summary reflects the active stream filter (All/main/enhanced/custom pick)
  // Single-agency view row: MBTA — alerts
  //   (agency name/link lives in the page-level header instead)
  const dash='<span style="color:#8b949e;font-size:0.85rem">—</span>';
  const summarySpan='<span class="day-count" style="flex-basis:100%">(' + summaryText + ')</span>';
  const headerText = activeAgency === 'All'
    ? '<span class="agency-code">' + ag.agency + '</span>' + dash + agencyNameLink(ag) + summarySpan
    : '<span class="agency-code">' + ag.agency + '</span>' + dash + '<span class="agency-code">' + (streamName || 'data') + '</span>' + summarySpan;
  hdr.innerHTML = headerText;
  block.appendChild(hdr);

  const outer=document.createElement('div');outer.className='cal-outer';

  // "All time": stack one calendar per year (newest first) with a year label
  // above each; a single year renders exactly as before.
  const isAllTime=activeYear==='All';
  const yearList=isAllTime
    ? [...new Set(Object.keys(days).map(d=>d.slice(0,4)))].sort().reverse()
    : [activeYear];
  yearList.forEach(yr=>{
    if(isAllTime){
      const yl=document.createElement('div');
      yl.className='year-hdr';
      yl.textContent=yr;
      outer.appendChild(yl);
    }
    const yDays=isAllTime?getAgencyDays(ag, streamName, yr):days;
    buildYearCal(yDays, yr).forEach(el=>outer.appendChild(el));
  });

  // Legend — right-aligned, same width as scrollable calendar area
  const legend=document.createElement('div');
  legend.className='cal-legend';
  const less=document.createElement('span');less.textContent='Less';
  legend.appendChild(less);
  for(let i=0;i<=4;i++){
    const sq=document.createElement('span');
    sq.className='legend-sq';sq.style.background=CAL_COLORS[i];sq.title=TIPS[i];
    legend.appendChild(sq);
  }
  const more=document.createElement('span');more.textContent='More';
  legend.appendChild(more);

  outer.appendChild(legend);
  block.appendChild(outer);
  return block;
}

function buildAgencyStreamBlocks(ag){
  const blocks=[];
  const visibleStreams = Object.keys(ag.streams || {}).filter(stream=>
    Object.keys(getAgencyDays(ag, stream)).length>0
  );
  visibleStreams.sort().forEach(stream=>{
    const block=buildAgency(ag, stream);
    if(block)blocks.push(block);
  });
  return blocks;
}

function buildAgencyPageHeader(ag){
  // Page-level header for the single-agency view:
  // large agency name, followed by a small "(website)" link when a URL exists
  const header=document.createElement('div');
  header.className='agency-page-header';
  const site=ag.url
    ? ' <span class="site-wrap">(</span><a href="' + ag.url + '" target="_blank" rel="noopener">website</a><span class="site-wrap">)</span>'
    : '';
  header.innerHTML=ag.name + site;
  return header;
}

function renderAgencySelect(){
  const select=document.getElementById('agencySelect');
  select.innerHTML='';
  const options=[{value:'All',label:'All agencies'}, ...AGENCIES.map(ag=>({value:ag.agency,label:ag.name||ag.agency}))];
  options.forEach(opt=>{
    const option=document.createElement('option');
    option.value=opt.value;
    option.textContent=opt.label;
    if(opt.value===activeAgency)option.selected=true;
    select.appendChild(option);
  });
  select.onchange=()=>{
    activeAgency=select.value;
    activeStream='All';
    renderAgencySelect();
    renderYearBar();
    renderStreamBar();
    renderAll();
    setGridLayout();
  };
}

function setStreamFilterVisibility(){
  // Single-agency view shows only the Agency and Year controls
  const showFilters=activeAgency==='All';
  ['sg-main','sg-enhanced','sg-custom'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.style.display=showFilters?'':'none';
  });
}

function renderAll(){
  const root=document.getElementById('cal-root');
  root.innerHTML='';
  if(activeAgency !== 'All'){
    const ag=AGENCIES.find(x=>x.agency===activeAgency);
    if(!ag){
      root.innerHTML='<p style="color:#8b949e;font-size:0.85rem">No agency selected.</p>';
      return;
    }
    root.appendChild(buildAgencyPageHeader(ag));
    const blocks=buildAgencyStreamBlocks(ag);
    if(blocks.length){
      blocks.forEach(block=>root.appendChild(block));
      return;
    }
    const empty=document.createElement('p');
    empty.style.cssText='color:#8b949e;font-size:0.85rem';
    empty.textContent='No realtime data captured for '+(activeYear==='All'?'all time':activeYear)+' for '+ag.agency+'.';
    root.appendChild(empty);
    return;
  }
  let count=0;
  AGENCIES.forEach(ag=>{
    const el=buildAgency(ag);
    if(el){root.appendChild(el);count++;}
  });
  if(count===0){
    root.innerHTML='<p style="color:#8b949e;font-size:0.85rem">No realtime data captured for '+activeYear+'.</p>';
  }
}

function renderYearBar(){
  const bar=document.getElementById('yearBtns');
  bar.innerHTML='';
  const scope = activeAgency === 'All' ? AGENCIES : AGENCIES.filter(ag=>ag.agency===activeAgency);
  // Newest year first (far left), descending; 'All time' sits before the years
  const allYears=[...new Set(scope.flatMap(ag=>Object.keys(ag.days).map(d=>d.slice(0,4))))].sort().reverse();
  if(activeYear!=='All'&&!allYears.includes(activeYear))activeYear=allYears[0]||String(new Date().getFullYear());
  const choices=allYears.length>1?['All',...allYears]:allYears;
  choices.forEach(y=>{
    const btn=document.createElement('button');
    btn.className='year-btn'+(y===activeYear?' active':'');
    btn.textContent=y==='All'?'All time':y;
    btn.onclick=()=>{activeYear=y;renderYearBar();renderStreamBar();renderAll();setGridLayout();};
    bar.appendChild(btn);
  });
}

function renderStreamBar(){
  setStreamFilterVisibility();
  // Single-agency view: no stream filters at all — bail before fillBar can
  // re-show the Enhanced/Custom wrappers that setStreamFilterVisibility just hid
  if(activeAgency !== 'All')return;
  const groups={main:new Set(),enhanced:new Set(),custom:new Set()};
  AGENCIES.forEach(ag=>{
    Object.entries(ag.streams||{}).forEach(([s,sd])=>{
      if(activeYear==='All'||Object.keys(sd).some(d=>d.startsWith(activeYear)))
        groups[streamGroup(s)].add(s);
    });
  });
  function fillBar(barId,streams,wrapId){
    const bar=document.getElementById(barId);
    bar.innerHTML='';
    if(wrapId){
      const wrap=document.getElementById(wrapId);
      if(!streams.length){wrap.style.display='none';return;}
      wrap.style.display='';
    }
    streams.forEach(s=>{
      const btn=document.createElement('button');
      btn.className='year-btn'+(s===activeStream?' active':'');
      btn.textContent=s;
      btn.onclick=()=>{activeStream=s;renderStreamBar();renderAll();setGridLayout();};
      bar.appendChild(btn);
    });
  }
  fillBar('streamMain',['All',...[...groups.main].sort()],null);
  fillBar('streamEnhanced',[...groups.enhanced].sort(),'sg-enhanced');
  fillBar('streamCustom',[...groups.custom].sort(),'sg-custom');
}

function setGridLayout(){
  const root=document.getElementById('cal-root');
  const blocks=Array.from(root.querySelectorAll('.agency-block'));
  if(!blocks.length)return;
  const maxW=Math.max(...blocks.map(b=>b.getBoundingClientRect().width));
  const avail=window.innerWidth-56;
  root.style.gridTemplateColumns=avail>=maxW*2+20?'repeat(2,max-content)':'max-content';
}

renderAgencySelect();
renderYearBar();
renderStreamBar();
renderAll();
setGridLayout();
window.addEventListener('resize',setGridLayout);
</script>
</body>
</html>
